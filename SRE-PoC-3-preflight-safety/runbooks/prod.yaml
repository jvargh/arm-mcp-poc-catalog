# Scope definition for the `prod` preflight run.
#
# This file is a TEMPLATE — committed to git, contains no environment-specific
# values. Real values live in a sibling `prod.values.yaml` (gitignored).
# At load time the skill substitutes `${key}` tokens from prod.values.yaml
# into this file. See SKILL.md "Step 1 — Load configuration".

scope: prod

# Subscriptions to include in ARG queries.
subscriptions: ["${subscription_id}"]

# Resource group inclusion / exclusion (case-insensitive substrings).
rg_include: ${rg_include}
rg_exclude: ${rg_exclude}

# Target resource group for the deployment (used in the deploy verb).
deployment_target_rg: "${deployment_target_rg}"

# Which rules to run per environment. Omit a key to run all rules.
# Map of env-name → list of rule_ids.
# Example: to run a lighter check set for staging, add:
#   staging: [R001, R002, R003, R008]
preflight_rules_per_env:
  prod: [R001, R002, R003, R004, R005, R006, R007, R008, R009]

# Set to true to allow deployment even when preflight checks fail.
# When true, an audit warning is emitted and written to exports/.
# REQUIRES a written justification in the deploy prompt — no justification = blocked.
force_deploy_flag: false

# Maximum total wall-clock seconds for the entire preflight battery.
# Checks that exceed this budget are recorded as TIMEOUT.
preflight_timeout_seconds: 30

# Quota limits for R005 comparison.
# ARG returns current usage but NOT subscription limits.
# Operator MUST keep these in sync with `az vm list-usage` output.
# See ratification #6.
quota_limits:
  # vm_cores_per_region: operator must fill in per-region vCPU quota
  vm_cores_per_region: 0       # 0 = not configured; R005 will SKIP
  public_ip_addresses: 0       # 0 = not configured; R005 will SKIP
  network_interfaces: 0        # 0 = not configured; R005 will SKIP
  storage_accounts: 0          # 0 = not configured; R005 will SKIP
