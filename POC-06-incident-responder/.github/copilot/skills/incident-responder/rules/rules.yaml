# Incident Responder — Rule Pack v1
# DO NOT EDIT during a run. The agent hashes this file to derive the run_id.
# Each rule has: id, title, severity, weight, category, kql, skip_if_unavailable.
# weight is informational only — this PoC is read-only and does not score workloads.
# kql MUST return a column named `resourceGroup` and `id` where applicable.
#
# Scope tokens substituted by the agent at runtime (string substitution only):
#   ${time_window_hours}  — from runbook default_time_window_hours (default 2)
#
# Subscriptions are passed as the `subscriptions` parameter to execute_query, not
# injected into the KQL text. RG filters are applied to the result set.

version: 1

rules:
  - id: R001
    title: Resources changed in time window
    severity: high
    weight: 0
    category: change-feed
    skip_if_unavailable: true
    kql: |
      resourcechanges
      | where changeTime >= ago(${time_window_hours}h)
      | project changeTime, id, changeType=tostring(changeType), resourceGroup,
               subscriptionId, targetResourceType=tostring(targetResourceType)
      | order by changeTime desc

  - id: R002
    title: In-flight ARM deployments (status Running)
    severity: high
    weight: 0
    category: in-flight-deployments
    skip_if_unavailable: false
    kql: |
      Resources
      | where type =~ 'microsoft.resources/deployments'
      | where tostring(properties.provisioningState) =~ 'Running'
      | project id, name, resourceGroup, subscriptionId,
               startTime=tostring(properties.timestamp),
               location
      | order by startTime desc

  - id: R003
    title: Recent RBAC changes (authorizationresources)
    severity: medium
    weight: 0
    category: audit
    skip_if_unavailable: true
    kql: |
      authorizationresources
      | where type =~ 'microsoft.authorization/roleassignments'
      | where isnotempty(tostring(properties.createdOn))
      | project id, name, resourceGroup, subscriptionId,
               createdOn=tostring(properties.createdOn),
               roleDefinitionId=tostring(properties.roleDefinitionId),
               principalId=tostring(properties.principalId)
      | order by createdOn desc
