# Runbook definition for the `prod` failover runbook.
#
# This file is a TEMPLATE — committed to git, contains no environment-specific
# values. Real values live in a sibling `prod.values.yaml` (gitignored).
# At load time the skill substitutes `${key}` tokens from prod.values.yaml.
# See SKILL.md "Step 1 — Load configuration".

runbook_name: failover-runbook

# Subscriptions for ARG check queries. Empty list = all subs the user can read.
subscriptions: ["${subscription_id}"]

# Path where the agent persists run state (JSON) after each step.
# The file is created fresh per run; an existing IN_PROGRESS file triggers resume.
state_file_path: exports/prod-run-state.json

# Default step timeout in seconds. Individual steps can override with max_timeout_seconds.
max_step_timeout_seconds: 300

# ─── Runbook DSL steps ────────────────────────────────────────────────────────
# Each step is validated against the step type schemas in
# skills/runbook-executor/rules/rules.yaml before execution.
# Types: check | deploy | confirm | rollback
# ─────────────────────────────────────────────────────────────────────────────

runbook_steps:

  - name: Check pre-conditions — primary region health
    type: check
    kql_or_template: |
      Resources
      | where type =~ 'microsoft.compute/virtualmachines'
      | where location =~ '${primary_region}'
      | where tostring(properties.provisioningState) !~ 'Succeeded'
      | project id, name, resourceGroup, subscriptionId, location,
                provisioningState=tostring(properties.provisioningState)
    params: {}
    on_fail: halt
    max_timeout_seconds: 120

  - name: Check pre-conditions — failover region capacity
    type: check
    kql_or_template: |
      Resources
      | where type =~ 'microsoft.compute/virtualmachines'
      | where location =~ '${failover_region}'
      | where tostring(properties.provisioningState) =~ 'Succeeded'
      | project id, name, resourceGroup, subscriptionId, location
    params: {}
    on_fail: halt
    max_timeout_seconds: 120

  - name: Confirm failover gate
    type: confirm
    kql_or_template: null
    params: {}
    on_fail: halt

  - name: Deploy failover — redirect traffic to failover region
    type: deploy
    kql_or_template: remediation/example-failover-deploy.json
    params:
      primaryRegion: "${primary_region}"
      failoverRegion: "${failover_region}"
      trafficManagerProfileName: "${traffic_manager_profile}"
      trafficManagerResourceGroup: "${traffic_manager_rg}"
      primaryEndpointName: "${primary_endpoint_name}"
      failoverEndpointName: "${failover_endpoint_name}"
      deploymentLabel: "rbook-failover-${runbook_name}"
    on_fail: rollback
    max_timeout_seconds: 300

  - name: Check post-deploy health — failover region serving traffic
    type: check
    kql_or_template: |
      Resources
      | where type =~ 'microsoft.network/trafficmanagerprofiles'
      | where name =~ '${traffic_manager_profile}'
      | mv-expand endpoint = properties.endpoints
      | where tostring(endpoint.name) =~ '${failover_endpoint_name}'
      | where tostring(endpoint.properties.endpointStatus) =~ 'Enabled'
      | project id, name, resourceGroup, subscriptionId, endpointName=tostring(endpoint.name)
    params: {}
    on_fail: rollback
    max_timeout_seconds: 120

  - name: Confirm success or rollback gate
    type: confirm
    kql_or_template: null
    params: {}
    on_fail: rollback

  - name: Rollback — restore primary region if needed
    type: rollback
    kql_or_template: remediation/example-failover-rollback.json
    params:
      primaryRegion: "${primary_region}"
      failoverRegion: "${failover_region}"
      trafficManagerProfileName: "${traffic_manager_profile}"
      trafficManagerResourceGroup: "${traffic_manager_rg}"
      primaryEndpointName: "${primary_endpoint_name}"
      failoverEndpointName: "${failover_endpoint_name}"
      deploymentLabel: "rbook-rollback-${runbook_name}"
    on_fail: halt
    max_timeout_seconds: 300
